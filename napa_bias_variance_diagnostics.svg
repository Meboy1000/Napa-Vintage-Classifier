<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620" role="img" aria-labelledby="title desc">
  <title id="title">Napa Vintage Classifier Bias-Variance Diagnostics</title>
  <desc id="desc">Learning and regularization curves for macro F1.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #5f6368; }
    .panel { font-size: 18px; font-weight: 650; }
    .axis { stroke: #6b7280; stroke-width: 1.3; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .tick { font-size: 12px; fill: #4b5563; }
    .note { font-size: 13px; fill: #374151; }
    .legend { font-size: 12px; }
  </style>
  <rect width="1300" height="620" fill="#ffffff"/>
  <text x="650" y="42" text-anchor="middle" class="title">Napa Vintage Classifier: Bias–Variance Diagnostics</text>
  <text x="650" y="66" text-anchor="middle" class="subtitle">Text + variety + subregion logistic regression · 2005–2015 Napa wines · group-aware five-fold CV</text>

  <!-- Learning curve -->
  <text x="320" y="108" text-anchor="middle" class="panel">Learning curve</text>
  <g>
    <line x1="100" y1="150" x2="540" y2="150" class="grid"/><line x1="100" y1="220" x2="540" y2="220" class="grid"/><line x1="100" y1="290" x2="540" y2="290" class="grid"/><line x1="100" y1="360" x2="540" y2="360" class="grid"/><line x1="100" y1="430" x2="540" y2="430" class="grid"/>
    <line x1="100" y1="150" x2="100" y2="430" class="axis"/><line x1="100" y1="430" x2="540" y2="430" class="axis"/>
    <text x="90" y="434" text-anchor="end" class="tick">0.0</text><text x="90" y="364" text-anchor="end" class="tick">0.2</text><text x="90" y="294" text-anchor="end" class="tick">0.4</text><text x="90" y="224" text-anchor="end" class="tick">0.6</text><text x="90" y="154" text-anchor="end" class="tick">0.8</text>
    <text x="120" y="452" text-anchor="middle" class="tick">370</text><text x="220" y="452" text-anchor="middle" class="tick">927</text><text x="325" y="452" text-anchor="middle" class="tick">1,854</text><text x="430" y="452" text-anchor="middle" class="tick">2,781</text><text x="535" y="452" text-anchor="middle" class="tick">3,709</text>
    <text x="320" y="486" text-anchor="middle" class="tick">Training examples</text><text x="28" y="295" text-anchor="middle" class="tick" transform="rotate(-90 28 295)">Macro F1</text>
    <path d="M120 166 L220 175 L325 187 L430 196 L535 205" fill="none" stroke="#c44e52" stroke-width="3"/>
    <path d="M120 372 L220 361 L325 352 L430 344 L535 337" fill="none" stroke="#4c72b0" stroke-width="3"/>
    <line x1="100" y1="331" x2="540" y2="331" stroke="#55a868" stroke-width="2.5" stroke-dasharray="7 5"/>
    <g fill="#c44e52"><circle cx="120" cy="166" r="5"/><circle cx="220" cy="175" r="5"/><circle cx="325" cy="187" r="5"/><circle cx="430" cy="196" r="5"/><circle cx="535" cy="205" r="5"/></g>
    <g fill="#4c72b0"><circle cx="120" cy="372" r="5"/><circle cx="220" cy="361" r="5"/><circle cx="325" cy="352" r="5"/><circle cx="430" cy="344" r="5"/><circle cx="535" cy="337" r="5"/></g>
    <text x="126" y="130" class="legend" fill="#c44e52">● Training macro F1</text><text x="126" y="146" class="legend" fill="#4c72b0">● Group-CV macro F1</text><text x="360" y="326" class="legend" fill="#3f8050">-- Frozen-test macro F1 (0.282)</text>
    <text x="535" y="315" text-anchor="end" class="note">Validation score is still rising</text><text x="535" y="332" text-anchor="end" class="note">as more training data is added.</text>
  </g>

  <!-- Regularization curve -->
  <text x="975" y="108" text-anchor="middle" class="panel">Regularization curve</text>
  <g>
    <line x1="755" y1="150" x2="1195" y2="150" class="grid"/><line x1="755" y1="220" x2="1195" y2="220" class="grid"/><line x1="755" y1="290" x2="1195" y2="290" class="grid"/><line x1="755" y1="360" x2="1195" y2="360" class="grid"/><line x1="755" y1="430" x2="1195" y2="430" class="grid"/>
    <line x1="755" y1="150" x2="755" y2="430" class="axis"/><line x1="755" y1="430" x2="1195" y2="430" class="axis"/>
    <text x="745" y="434" text-anchor="end" class="tick">0.0</text><text x="745" y="364" text-anchor="end" class="tick">0.2</text><text x="745" y="294" text-anchor="end" class="tick">0.4</text><text x="745" y="224" text-anchor="end" class="tick">0.6</text><text x="745" y="154" text-anchor="end" class="tick">0.8</text>
    <text x="775" y="452" text-anchor="middle" class="tick">0.01</text><text x="875" y="452" text-anchor="middle" class="tick">0.03</text><text x="980" y="452" text-anchor="middle" class="tick">0.10</text><text x="1085" y="452" text-anchor="middle" class="tick">0.30</text><text x="1190" y="452" text-anchor="middle" class="tick">1.00</text>
    <text x="975" y="486" text-anchor="middle" class="tick">C (higher = weaker regularization)</text><text x="683" y="295" text-anchor="middle" class="tick" transform="rotate(-90 683 295)">Macro F1</text>
    <path d="M775 412 L875 390 L980 348 L1085 279 L1190 181" fill="none" stroke="#c44e52" stroke-width="3"/>
    <path d="M775 415 L875 399 L980 378 L1085 358 L1190 337" fill="none" stroke="#4c72b0" stroke-width="3"/>
    <line x1="1190" y1="150" x2="1190" y2="430" stroke="#55a868" stroke-width="2.5" stroke-dasharray="7 5"/>
    <g fill="#c44e52"><circle cx="775" cy="412" r="5"/><circle cx="875" cy="390" r="5"/><circle cx="980" cy="348" r="5"/><circle cx="1085" cy="279" r="5"/><circle cx="1190" cy="181" r="5"/></g>
    <g fill="#4c72b0"><circle cx="775" cy="415" r="5"/><circle cx="875" cy="399" r="5"/><circle cx="980" cy="378" r="5"/><circle cx="1085" cy="358" r="5"/><circle cx="1190" cy="337" r="5"/></g>
    <text x="780" y="130" class="legend" fill="#c44e52">● Training macro F1</text><text x="780" y="146" class="legend" fill="#4c72b0">● Group-CV macro F1</text><text x="1040" y="166" class="legend" fill="#3f8050">-- Selected C = 1.0</text>
    <text x="1180" y="310" text-anchor="end" class="note">Large train–validation gap</text><text x="1180" y="327" text-anchor="end" class="note">shows high variance.</text>
  </g>
</svg>
